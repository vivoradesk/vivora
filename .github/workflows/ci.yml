name: ci

on:
  push:
    branches: [main]
  pull_request:

# The Windows job is compile-only and not a merge blocker. It builds against
# the official Qt binaries, which are shared libraries, while the artefacts we
# ship are built against a static Qt -- so it proves the source and the CMake
# are portable, not that the release build works. That still catches the thing
# it exists to catch: a change that only compiles on one machine.
jobs:
  core:
    name: core (no Qt)
    runs-on: ubuntu-latest
    # debian:11 rather than the runner image: glibc 2.31 is the floor the
    # release artefacts are built against, and the gate should fail here
    # rather than in packaging if something starts needing a newer one.
    container: debian:11
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ninja-build pkg-config git ca-certificates curl \
            libpulse-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bullseye's own cmake is 3.18 and the tree asks for 3.20, so the apt
      # package cannot configure this project at all.
      - name: Install CMake
        run: scripts/ci-install-cmake.sh

      # VIVORA_BUILD_APP=OFF drops Qt, ffmpeg and PipeWire from the configure
      # entirely, which is what makes this gate a couple of minutes instead of
      # a couple of hours.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIVORA_BUILD_APP=OFF \
            -DVIVORA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # assert() compiles out under NDEBUG, and the shipped configuration is
      # Release -- so a suite that only ran there would pass vacuously. Every
      # suite checks through tests/check.h for that reason (VIV-140), which
      # makes the Release run above a real gate; this Debug run is for what
      # Release cannot see: the standard library's own assertions, and
      # out-of-bounds access in the [size, capacity) window that Release and
      # ASan both miss.
      - name: Configure (Debug)
        run: |
          cmake -S . -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVIVORA_BUILD_APP=OFF \
            -DVIVORA_BUILD_TESTS=ON

      - name: Build (Debug)
        run: cmake --build build-debug

      - name: Test (Debug)
        run: ctest --test-dir build-debug --output-on-failure

  linux-app:
    name: linux app (Qt)
    runs-on: ubuntu-latest
    container: debian:11
    # Compile-only, and not a merge blocker yet: the official Qt binaries are
    # a different build from the one the release image compiles, so this job
    # is expected to shake out missing dev packages for a while.
    continue-on-error: true
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ninja-build pkg-config git ca-certificates curl \
            python3 python3-pip python3-venv \
            libavcodec-dev libavutil-dev libswscale-dev \
            libva-dev \
            libpipewire-0.3-dev libdbus-1-dev libpulse-dev libwayland-dev \
            libgl-dev libegl-dev libglx-dev libopengl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: scripts/ci-install-cmake.sh

      - name: Install Qt
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet aqtinstall
          # qtdeclarative ships in the base desktop package in Qt 6, so asking
          # for it as a module makes aqt fail outright: "The packages
          # ['qtdeclarative'] were not found while parsing XML of package
          # information". qtshadertools is a real add-on, and it is all the
          # windows-app job asks for too.
          /opt/venv/bin/aqt install-qt linux desktop 6.8.2 linux_gcc_64 \
            -m qtshadertools --outputdir /opt/qt

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/qt/6.8.2/gcc_64 \
            -DVIVORA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

  windows-app:
    name: windows app (Qt)
    runs-on: windows-latest
    # Unblocked by moving the QML to qt_add_qml_module (VIV-121): before that
    # the link line named Qt's internal resource objects by absolute path and
    # nothing but the developer's machine could satisfy it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtshadertools'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVIVORA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      # A runner has no GPU: encode_test wants a hardware encoder (AMF / NVENC
      # / QSV), decode_test a D3D11 video device, and transport_test drives an
      # encoder end to end -- all three segfault or fail on the way to saying
      # "no device". capture_test does run, because DXGI duplicates the
      # runner's virtual display fine. Excluding the three keeps this job a
      # signal rather than a permanent red light; they are covered on real
      # hardware before a release.
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          -E "encode_test|transport_test|decode_test"

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The signing key for Pro licences lives in the working tree of whoever
      # runs the relay, next to a .gitignore entry telling git to skip it. One
      # `git add -f` and it is public forever.
      - name: No secrets committed
        run: scripts/check-no-secrets.sh

      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --no-net packaging/linux/dev.vivora.app.metainfo.xml
