name: build image

# The Debian 11 image the Linux release artefacts are built in.
#
# It compiles Qt and OpenSSL from source, which takes a couple of hours, so it
# is built here once and pushed to the registry rather than rebuilt on every
# tag. The release workflow then just pulls it and the AppImage build is a
# normal incremental compile.
#
# Runs when the Containerfile changes, and on demand. Not on every push:
# nothing else in the repository affects the image.
on:
  push:
    branches: [master, main]
    paths: ['packaging/linux/Containerfile', '.github/workflows/build-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: vivora-build (Debian 11 + Qt)
    runs-on: ubuntu-latest
    # A cold build compiles Qt 6.8.2 and OpenSSL 3; the default 6 h ceiling is
    # enough but leaves no room to spare on a slow runner.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vivora-build:latest
          # The layer cache is what makes a Containerfile tweak minutes rather
          # than hours: only the changed layer and everything after it rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
